services:
  - type: web
    name: unaib-pos-terminal
    env: node
    plan: free
    buildCommand: npm install && npm run build:react
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
